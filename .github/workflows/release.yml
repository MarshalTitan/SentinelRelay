name: Publish Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-live]')
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download current Dalamud development assemblies
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Validate version and immutable release state
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'SentinelRelay.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version must contain four numeric components: $version"
          }
          $tag = "v$version"
          $entry = @(Get-Content -LiteralPath 'repo.json' -Raw | ConvertFrom-Json) | Select-Object -First 1
          if ($entry.InternalName -ne 'SentinelRelay' -or $entry.AssemblyVersion -ne $version) {
            throw 'repo.json must contain SentinelRelay at the project version before release.'
          }
          if ([bool]$entry.IsTestingExclusive) {
            throw 'Live releases must not be marked IsTestingExclusive.'
          }
          $expectedAsset = "https://github.com/MarshalTitan/SentinelRelay/releases/download/v$version/SentinelRelay.zip"
          if ($entry.DownloadLinkInstall -ne $expectedAsset) {
            throw "repo.json release URL does not match: $expectedAsset"
          }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release '$tag' already exists. Increment the version; published assets are immutable."
          }
          $global:LASTEXITCODE = 0
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore locked dependencies
        run: dotnet restore SentinelRelay.csproj --locked-mode

      - name: Run plugin core tests
        run: dotnet run --project tests/SentinelRelay.Core.Tests/SentinelRelay.Core.Tests.csproj -c Release

      - name: Build release package
        run: dotnet build SentinelRelay.csproj -c Release --no-restore

      - name: Validate installable package
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-Package.ps1
          -PackagePath 'bin/Release/SentinelRelay/latest.zip'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare named release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/SentinelRelay/latest.zip' -Destination "$env:RUNNER_TEMP\SentinelRelay.zip" -Force

      - name: Publish live GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' "$env:RUNNER_TEMP\SentinelRelay.zip" `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "Sentinel Relay ${{ steps.version.outputs.value }}" `
            --notes 'Live Sentinel Relay release with compact direct-webhook chat delivery and optional, disabled-by-default authorized /fc replies. No hosted relay service or companion program is required.'

      - name: Remove personal wording from superseded release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 'v0.1.0.0' --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit 'v0.1.0.0' `
              --repo '${{ github.repository }}' `
              --title 'Sentinel Relay 0.1.0.0 (superseded)' `
              --notes 'Superseded by the current live Sentinel Relay release.'
          }
          $global:LASTEXITCODE = 0

      - name: Verify public release asset
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelRelay.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-SentinelRelay.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download
              if ((Get-Item $download).Length -gt 0) { break }
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }
          ./.github/scripts/Validate-Package.ps1 -PackagePath $download -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Detect central catalog authorization
        id: catalog-auth
        shell: pwsh
        env:
          CATALOG_TOKEN: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CATALOG_TOKEN)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host '::notice::DALAMUD_CATALOG_TOKEN is not configured. The release is online, but the central catalog requires a separate update.'
          }
          else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Check out central catalog
        if: steps.catalog-auth.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: MarshalTitan/Sentinel
          ref: main
          token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
          path: central-catalog

      - name: Update only SentinelRelay in central catalog
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        run: >-
          ./.github/scripts/Upsert-CentralCatalogEntry.ps1
          -ManifestPath 'central-catalog/repo.json'
          -Version '${{ steps.version.outputs.value }}'
          -ReleaseAssetUrl 'https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelRelay.zip'

      - name: Validate and publish central catalog update
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        working-directory: central-catalog
        run: |
          ./.github/scripts/Test-Catalog.ps1 `
            -CatalogPath 'repo.json' `
            -VerifyRemoteAssets `
            -ExpectedInternalName 'SentinelRelay' `
            -ExpectedVersion '${{ steps.version.outputs.value }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish SentinelRelay ${{ steps.version.outputs.value }}"
            git push origin HEAD:main
          }

      - name: Verify public central catalog
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $catalogUrl = 'https://raw.githubusercontent.com/MarshalTitan/Sentinel/main/repo.json'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $catalog = @(Invoke-RestMethod -Uri "$catalogUrl`?release=${{ github.run_id }}-$attempt")
              $entry = @($catalog | Where-Object InternalName -eq 'SentinelRelay')
              if ($entry.Count -eq 1 `
                  -and $entry[0].AssemblyVersion -eq '${{ steps.version.outputs.value }}' `
                  -and -not [bool]$entry[0].IsTestingExclusive) {
                Write-Host 'Verified public live SentinelRelay catalog entry.'
                exit 0
              }
            }
            catch {
              if ($attempt -eq 12) { throw }
            }
            Start-Sleep -Seconds 5
          }
          throw 'The public SentinelRelay catalog entry did not reach the expected live state.'
