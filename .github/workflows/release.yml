name: Publish Online Beta

on:
  workflow_dispatch:
    inputs:
      publication_mode:
        description: 'Publish for testing, or promote the existing tested release.'
        required: true
        default: testing
        type: choice
        options:
          - testing
          - live
      live_tested:
        description: 'Required only for live promotion: both character routes passed LIVE_TEST_CHECKLIST.md.'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-online-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-testing]')
    runs-on: windows-latest

    steps:
      - name: Select publication mode
        id: publication
        shell: pwsh
        run: |
          $mode = if ('${{ github.event_name }}' -eq 'push') { 'testing' } else { '${{ inputs.publication_mode }}' }
          $liveTested = '${{ inputs.live_tested }}' -eq 'true'
          if ($mode -notin @('testing', 'live')) {
            throw "Unknown publication mode '$mode'."
          }
          if ($mode -eq 'live' -and -not $liveTested) {
            throw 'Live promotion requires completion of LIVE_TEST_CHECKLIST.md for both characters.'
          }
          $testingOnly = $mode -eq 'testing'
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "testing_only=$($testingOnly.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Publication mode: $mode"

      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download current Dalamud development assemblies
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Validate version and release state
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'SentinelRelay.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version must contain four numeric components: $version"
          }
          $tag = "v$version"
          $entry = @(Get-Content -LiteralPath 'repo.json' -Raw | ConvertFrom-Json) | Select-Object -First 1
          if ($entry.InternalName -ne 'SentinelRelay' -or $entry.AssemblyVersion -ne $version) {
            throw 'repo.json must contain SentinelRelay at the project version before release.'
          }
          $expectedAsset = "https://github.com/MarshalTitan/SentinelRelay/releases/download/v$version/SentinelRelay.zip"
          if ($entry.DownloadLinkInstall -ne $expectedAsset) {
            throw "repo.json release URL does not match: $expectedAsset"
          }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ('${{ steps.publication.outputs.mode }}' -eq 'testing' -and $releaseExists) {
            $releaseTarget = gh release view $tag --repo '${{ github.repository }}' --json targetCommitish --jq '.targetCommitish'
            if ($releaseTarget -ne '${{ github.sha }}') {
              throw "Testing release '$tag' already belongs to commit '$releaseTarget' and is immutable. Increment the version for another build."
            }
            Write-Host "Reusing testing release '$tag' for this same commit."
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore locked dependencies
        run: dotnet restore SentinelRelay.csproj --locked-mode

      - name: Run plugin core tests
        run: dotnet run --project tests/SentinelRelay.Core.Tests/SentinelRelay.Core.Tests.csproj -c Release

      - name: Build release package
        run: dotnet build SentinelRelay.csproj -c Release --no-restore

      - name: Validate installable package
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-Package.ps1
          -PackagePath 'bin/Release/SentinelRelay/latest.zip'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare named release asset
        if: steps.version.outputs.release_exists != 'true'
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/SentinelRelay/latest.zip' -Destination "$env:RUNNER_TEMP\SentinelRelay.zip" -Force

      - name: Publish immutable GitHub prerelease
        if: steps.version.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = if ('${{ steps.publication.outputs.testing_only }}' -eq 'true') {
            'Online testing build for Wrothy and Elektra. Direct per-character FFXIV-to-Discord webhook relay with no hosted backend. In-game validation is still in progress; see LIVE_TEST_CHECKLIST.md.'
          }
          else {
            'Live-tested Sentinel Relay beta. Direct per-character FFXIV-to-Discord webhook relay with no hosted backend. Both character routes completed LIVE_TEST_CHECKLIST.md.'
          }
          gh release create '${{ steps.version.outputs.tag }}' "$env:RUNNER_TEMP\SentinelRelay.zip" `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "Sentinel Relay ${{ steps.version.outputs.value }} beta" `
            --notes $notes `
            --prerelease

      - name: Verify public release asset
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelRelay.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-SentinelRelay.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download
              if ((Get-Item $download).Length -gt 0) { break }
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }
          ./.github/scripts/Validate-Package.ps1 -PackagePath $download -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Detect central catalog authorization
        id: catalog-auth
        shell: pwsh
        env:
          CATALOG_TOKEN: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CATALOG_TOKEN)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host '::notice::DALAMUD_CATALOG_TOKEN is not configured. The release is online, but the central catalog requires a separate update.'
          }
          else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Check out central catalog
        if: steps.catalog-auth.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: MarshalTitan/Sentinel
          ref: main
          token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
          path: central-catalog

      - name: Add or update only SentinelRelay in central catalog
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $testingOnly = '${{ steps.publication.outputs.testing_only }}' -eq 'true'
          ./.github/scripts/Upsert-CentralCatalogEntry.ps1 `
            -ManifestPath 'central-catalog/repo.json' `
            -Version '${{ steps.version.outputs.value }}' `
            -ReleaseAssetUrl 'https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelRelay.zip' `
            -TestingOnly:$testingOnly

      - name: Validate and publish central catalog update
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        working-directory: central-catalog
        run: |
          ./.github/scripts/Test-Catalog.ps1 `
            -CatalogPath 'repo.json' `
            -VerifyRemoteAssets `
            -ExpectedInternalName 'SentinelRelay' `
            -ExpectedVersion '${{ steps.version.outputs.value }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $suffix = if ('${{ steps.publication.outputs.testing_only }}' -eq 'true') { 'testing beta' } else { 'live beta' }
            git commit -m "Publish SentinelRelay ${{ steps.version.outputs.value }} $suffix"
            git push origin HEAD:main
          }

      - name: Verify public central catalog
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $expectedTestingOnly = '${{ steps.publication.outputs.testing_only }}' -eq 'true'
          $catalogUrl = 'https://raw.githubusercontent.com/MarshalTitan/Sentinel/main/repo.json'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $catalog = @(Invoke-RestMethod -Uri "$catalogUrl`?release=${{ github.run_id }}-$attempt")
              $entry = @($catalog | Where-Object InternalName -eq 'SentinelRelay')
              if ($entry.Count -eq 1 `
                  -and $entry[0].AssemblyVersion -eq '${{ steps.version.outputs.value }}' `
                  -and [bool]$entry[0].IsTestingExclusive -eq $expectedTestingOnly) {
                Write-Host "Verified public SentinelRelay catalog entry (testing-only: $expectedTestingOnly)."
                exit 0
              }
            }
            catch {
              if ($attempt -eq 12) { throw }
            }
            Start-Sleep -Seconds 5
          }
          throw 'The public SentinelRelay catalog entry did not reach the expected state.'
